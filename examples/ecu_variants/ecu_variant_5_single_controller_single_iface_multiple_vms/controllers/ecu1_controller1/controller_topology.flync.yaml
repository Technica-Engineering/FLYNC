connections:
  # The bridge uplink: br0 onto the controller's physical interface. The hop from that physical
  # interface out to the ECU is declared separately, in the ECU's topology.flync.yaml.
  - type: switch_port_to_controller_interface
    id: vconn1
    switch: br0
    switch_port: br0_p1
    controller_interface: ecu1_controller1_iface1
  - type: switch_port_to_controller_interface
    id: vconn2
    switch: br0
    switch_port: br0_p2
    controller_interface: ecu1_c1_node1_eth0
  - type: switch_port_to_controller_interface
    id: vconn3
    switch: br0
    switch_port: br0_p3
    controller_interface: ecu1_c1_node2_eth0
