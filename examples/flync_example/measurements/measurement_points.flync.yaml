measurement_points:
  - name: gateway_backbone_tap
    interface_id: 0x00010001
    description: Inline tap of the HPC-to-zonal-gateway backbone cable; both ECUs keep communicating.
    payload_types:
      - ethernet
    observes:
      - zgw_c1_iface1

  - name: gateway_vlan40_tap
    interface_id: 0x00010003
    description: Tap of VLAN 40 on the zonal gateway's Ethernet backbone.
    payload_types:
      - ethernet
    observes:
      - zgw_c1_i1_viface1

  - name: body_can_tap
    interface_id: 0x00020001
    description: Tap of the body CAN bus.
    payload_types:
      - can
    observes:
      - BodyCAN

  - name: diagnostics_can_fd_tap
    interface_id: 0x00020002
    description: Tap of the diagnostics CAN FD bus.
    payload_types:
      - can
      - can_fd
    observes:
      - DiagCAN

  - name: body_lin_tap
    interface_id: 0x00020003
    description: Tap of the body LIN bus.
    payload_types:
      - lin
    observes:
      - BodyLIN
