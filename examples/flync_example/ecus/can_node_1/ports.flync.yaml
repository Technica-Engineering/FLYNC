# This node attaches to BodyCAN through its CAN interface (bus_ref), not
# through a port. The ECU model requires at least one port, so this single
# port is a placeholder and is intentionally left unconnected.
ports:
  - name: cn1_p1
    mdi_config:
      mode: base_t1
      speed: 100
      duplex: full
      role: slave
      autonegotiation: false
