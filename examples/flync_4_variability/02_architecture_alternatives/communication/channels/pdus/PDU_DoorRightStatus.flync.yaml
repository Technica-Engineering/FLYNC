name: PDU_DoorRightStatus
type: standard
length: 2
description: Lock and window state of the right door. Sent by the door module over the 10BASE-T1S door
  segment, to the body domain controller or to the front zone controller.
signals:
  - bit_position: 0
    endianness: LE
    signal:
      name: DoorRightLocked
      description: 1 = locked.
      bit_length: 8
      data_type: uint8
  - bit_position: 8
    endianness: LE
    signal:
      name: WindowRightPosition
      description: Window position in percent, 0 = closed.
      bit_length: 8
      data_type: uint8
      lower_limit: 0
      upper_limit: 100
      unit: "%"
