.base:
  image: python:3.12
  tags:
    - docker-linux
  before_script:
    - pip install --upgrade pip
    - pip install uv

stages:
  - static-analysis
  - tests
  - sonar
  - code_review
  - docs
  - deploy

lint:
  extends: .base
  stage: static-analysis
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - uv sync --frozen --no-install-project --only-group static-analysis
    - uv run flake8 --max-line-length 149 src
    - uv run flake8 --max-line-length 149 src --format=html --htmldir=flake8-report
  artifacts:
    expire_in: 2 days
    paths:
      - flake8-report
    when: on_failure

format:
  extends: .base
  stage: static-analysis
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - uv sync --frozen --no-install-project --only-group static-analysis
    - mkdir format-reports
    - uv run black --target-version py312 --check --diff --color src > format-reports/black-report-src.diff
    - uv run black --target-version py312 --check --diff --color tests > format-reports/black-report-tests.diff
  artifacts:
    expire_in: 2 days
    paths:
      - format-reports
    when: on_failure

isort:
  extends: .base
  stage: static-analysis
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - uv sync --frozen --no-install-project --only-group static-analysis
    - mkdir format-reports
    - uv run isort --check --diff --color --line-length 149 src > format-reports/isort-report-src.diff
    - uv run isort --check --diff --color --line-length 149 tests > format-reports/isort-report-tests.diff
  artifacts:
    expire_in: 2 days
    paths:
      - format-reports
    when: on_failure

type_check:
  extends: .base
  stage: static-analysis
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - uv sync --frozen --group static-analysis --extra gui --extra tui
    - mkdir type-check-reports
    - uv run mypy src --show-error-codes --pretty --install-types --non-interactive | tee type-check-reports/mypy-report.txt
  artifacts:
    expire_in: 2 days
    paths:
      - type-check-reports/
    when: on_failure

error-catalog-integrity:
  extends: .base
  stage: static-analysis
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - uv sync --frozen
    - uv run python src/flync_cli/main.py errors validate-catalog

examples_validation:
  extends: .base
  stage: tests
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - uv sync --frozen
    - uv run python scripts/ci/validate_examples.py

performance_tests:
  extends: .base
  tags:
    - k8s-pilot-cluster-linux-runner
  allow_failure: true
  stage: tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_TAG'
  script:
    - apt-get update && apt-get install -y libglib2.0-0 libgl1 libegl1 libdbus-1-3 libfontconfig1 libxcb1 libxkbcommon0
    - uv sync --frozen --group test --group qt --extra gui --extra tui
    - uv pip install -e tests/converter_tests/test_plugin/ --no-deps
    # -n 0 overrides the `-n auto` in addopts: pytest-benchmark disables itself under xdist.
    - COVERAGE_FILE=.coverage.performance uv run pytest -n 0 -m performance --cov=flync --cov=flync_cli --cov=flync_converter --cov-report= --junitxml=report_performance.xml --durations=0
  artifacts:
    when: always
    expire_in: "30 days"
    paths:
      - .coverage.performance
      - report_performance.xml

unit_tests:
  extends: .base
  allow_failure: false
  stage: tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_TAG'
  script:
    - apt-get update && apt-get install -y libglib2.0-0 libgl1 libegl1 libdbus-1-3 libfontconfig1 libxcb1 libxkbcommon0
    - uv sync --frozen --group test --group qt --extra gui --extra tui
    - uv pip install -e tests/converter_tests/test_plugin/ --no-deps
    - COVERAGE_FILE=.coverage.unit uv run pytest -m "not performance" --cov=flync --cov=flync_cli --cov=flync_converter --cov-report= --junitxml=report_not_performance.xml --durations=0
  artifacts:
    when: always
    expire_in: "30 days"
    paths:
      - .coverage.unit
      - report_not_performance.xml

test-summary:
  extends: .base
  stage: tests
  needs:
    - job: performance_tests
      artifacts: true
    - job: unit_tests
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_TAG'
  script:
    - apt-get update && apt-get install -y libglib2.0-0 libgl1 libegl1 libdbus-1-3 libfontconfig1 libxcb1 libxkbcommon0
    - uv sync --frozen --group test --group qt --extra gui --extra tui
    - uv pip install -e tests/converter_tests/test_plugin/ --no-deps
    # performance_tests is allow_failure, so its artifacts may be absent.
    # Combine and merge whatever actually arrived rather than hard-failing.
    - |
      coverage_files=$(ls .coverage.unit .coverage.performance 2>/dev/null || true)
      junit_files=$(ls report_not_performance.xml report_performance.xml 2>/dev/null || true)
      if [ -z "$coverage_files" ] || [ -z "$junit_files" ]; then
        echo "No test artifacts found - both test jobs failed to produce reports" >&2
        exit 1
      fi
      for f in .coverage.performance report_performance.xml; do
        [ -f "$f" ] || echo "WARNING: $f missing - performance_tests produced no artifacts" >&2
      done
      uv run coverage combine $coverage_files
      uv run coverage xml
      uv run coverage report
      uv run python -m junitparser merge $junit_files report.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    expire_in: "30 days"
    paths:
      - report.xml
      - coverage.xml
      - tests/unit_test/sdk/approved_files/*
      - tests/unit_test/sdk/fuzzed/*
      - tests/unit_test/sdk/generated/*
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

sonar:scan:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
  needs:
    - job: test-summary
      artifacts: true
  script:
    - sonar-scanner
  allow_failure: false
  interruptible: true
  tags:
    - docker-linux

docs-build:
  extends: .base
  allow_failure: true
  needs:
    - job: test-summary
    - job: error-catalog-integrity
  stage: docs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - uv sync --frozen --group docs
    - echo "--- GENERATING ERROR CATALOG ---"
    - uv run python src/flync_cli/main.py errors generate-catalog
    - echo "--- BUILDING DOCS ---"
    - cd ./docs
    - make SPHINXOPTS='--fail-on-warning' html
    - cd ..
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - docs/build

pages:
  extends: .base
  stage: deploy
  needs:
    - job: docs-build
      artifacts: true
  script:
    - mv ./docs/build/html public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"
  artifacts:
    paths:
      - public

build:
  extends: .base
  stage: deploy
  needs: [test-summary]
  variables:
    GIT_DEPTH: "0"
  script:
    - uv build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "web"'
    - if: '$CI_COMMIT_TAG'
  artifacts:
    expire_in: 30 days
    paths:
      - dist
