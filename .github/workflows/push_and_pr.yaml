name: Workflow Push and Pull Request

on:
  push:
    branches:
    - main
    - release-*
  pull_request:
    branches:
    - main
    - release-*

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run black
        uses: psf/black@26.5.1
        with:
          options: "--check --verbose --line-length 149 --diff"
          src: "./src"

  isort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare
        run: uv sync --frozen --no-install-project --only-group static-analysis

      - name: Run isort
        run: |
          mkdir format-reports
          uv run isort --check --diff --color --line-length 149 src > format-reports/isort-report.diff

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isort-artifacts
          path: format-reports
          retention-days: 28

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare
        run: uv sync --frozen --no-install-project --only-group static-analysis

      - name: Run flake8
        run: |
          uv run flake8 --max-line-length 149 src
          uv run flake8 --max-line-length 149 src --format=html --htmldir=flake8-report

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lint-artifacts
          path: flake8-report
          retention-days: 28

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare
        run: |
          uv sync --frozen --group static-analysis --extra gui --extra tui
          mkdir type-check-reports

      - name: Run mypy
        run: |
          set -o pipefail
          uv run mypy src --show-error-codes --pretty --install-types --non-interactive | tee type-check-reports/mypy-report.txt

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: type-check-artifacts
          path: type-check-reports
          retention-days: 28

  error-catalogue-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare
        run: |
          uv sync --frozen
          mkdir error-catalogue-check

      - name: Run validate-catalogue
        run: |
          set -o pipefail
          uv run python src/flync_cli/main.py errors validate-catalogue | tee error-catalogue-check/error-catalogue-check.txt

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: type-check-artifacts
          path: type-check-reports
          retention-days: 28

  performance-tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [format-check, lint, type-check, isort]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y libglib2.0-0 libgl1 libegl1 libdbus-1-3 libfontconfig1 libxcb1 libxkbcommon0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare
        run: uv sync --frozen --group test --group qt --extra gui --extra tui

      - name: Run Performance tests
        run: |
          COVERAGE_FILE=.coverage.performance uv run pytest -m performance --cov=flync --cov=flync_cli --cov=flync_converter --cov-report= --junitxml=report_performance.xml --durations=0

      - name: Upload performance tests artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-coverage
          path: |
            .coverage.performance
            report_performance.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 28

  unit-tests:
    runs-on: ubuntu-latest
    needs: [format-check, lint, type-check, isort]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y libglib2.0-0 libgl1 libegl1 libdbus-1-3 libfontconfig1 libxcb1 libxkbcommon0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare
        run: uv sync --frozen --group test --group qt --extra gui --extra tui

      - name: Run Unittest
        run: |
          COVERAGE_FILE=.coverage.unit uv run pytest -m "not performance" --cov=flync --cov=flync_cli --cov=flync_converter --cov-report= --junitxml=report_not_performance.xml --durations=0

      - name: Upload unittest artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unittest-coverage
          path: |
            .coverage.unit
            report_not_performance.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 28

  tests-summary:
    runs-on: ubuntu-latest
    needs: [performance-tests, unit-tests]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download unittest artifacts
        uses: actions/download-artifact@v7
        with:
          name: unittest-coverage
          path: .

      - name: Download performance tests artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: performance-coverage
          path: .

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y libglib2.0-0 libgl1 libegl1 libdbus-1-3 libfontconfig1 libxcb1 libxkbcommon0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare
        run: uv sync --frozen --group test --group qt --extra gui --extra tui

      - name: Generate reports
        run: |
          uv run coverage combine .coverage.unit .coverage.performance
          uv run coverage xml
          uv run coverage report
          uv run python -m junitparser merge report_not_performance.xml report_performance.xml report.xml

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v7
        if: steps.coverage_comment.outputs.comment_file_written == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pytest-artifacts
          path: |
            .coverage
            .coverage.unit
            .coverage.performance
            report.xml
            coverage.xml
            report_not_performance.xml
            report_performance.xml
            tests/unit_test/sdk/fuzzed
            tests/unit_test/sdk/generated
          include-hidden-files: true
          retention-days: 28

  example-validation:
    runs-on: ubuntu-latest
    needs: [format-check, lint, type-check, isort]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare
        run: uv sync --frozen

      - name: Run validate_examples.py
        run: |
          uv run python scripts/ci/validate_examples.py

  build-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Prepare
        run: |
          cd docs
          pwd
          uv sync --frozen --group docs

      - name: Generate Error Catalogue
        run: |
          uv run python src/flync_cli/main.py errors generate-catalogue

      - name: Run make html
        run: |
          cd docs
          pwd
          make html

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation-artifacts
          path: docs/build/
          retention-days: 7
