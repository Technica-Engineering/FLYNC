name: SBOM

on:
  push:
    branches:
    - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Existing release-* tag to generate the SBOM for. The SBOM is attached
          to the GitHub release of that tag, which must already exist.
        required: true

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned by commit SHA, as in security.yaml.
env:
  SCANNER_VERSION: "v0.74.0"
  # Empty on a push to main: the SBOM then describes that commit and is kept as
  # a workflow artifact only.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  generate:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      file: ${{ steps.version.outputs.file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}
          # git describe needs the release-* tags to version a main build.
          fetch-depth: 0
          # The install step below builds third-party packages, which runs their
          # code on this runner.
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            case "$RELEASE_TAG" in
              release-*) ;;
              *) echo "::error::${RELEASE_TAG} is not a release-* tag."; exit 1 ;;
            esac
            version="${RELEASE_TAG#release-}"
          else
            # e.g. release-0.14.0-12-g5da1e2d -> 0.14.0-12-g5da1e2d
            desc=$(git describe --tags --long --match 'release-*' 2>/dev/null || echo "release-0.0.0-0-g$(git rev-parse --short HEAD)")
            version="${desc#release-}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "file=flync-${version}.cdx.json" >> "$GITHUB_OUTPUT"
          echo "SBOM version: ${version}"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # The SBOM describes what consumers of the flync distribution receive: the
      # runtime dependencies plus every extra, the same set the licence job in
      # security.yaml covers. Nothing under [dependency-groups] is distributed.
      # --no-default-groups is required because pyproject.toml sets
      # default-groups = ["dev"].
      #
      # Trivy is pointed at the exported requirements.txt alone. Scanning the
      # whole tree also picks up uv.lock and lists every package twice. The
      # installed distributions under VIRTUAL_ENV supply each package's licence.
      - name: Install the distributed dependency set
        run: |
          uv sync --frozen --all-extras --no-default-groups --no-install-project
          uv export --frozen --all-extras --no-default-groups --no-emit-project \
            --no-hashes --format requirements.txt --output-file requirements.txt

      - name: Verify scan inputs
        run: |
          [ -s requirements.txt ] || { echo "::error::requirements.txt was not exported."; exit 1; }
          pkgs=$(find .venv -type f -path "*.dist-info/METADATA" | wc -l)
          echo "Installed distributions on disk: ${pkgs}"
          if [ "$pkgs" -eq 0 ]; then
            echo "::error::No installed distributions under .venv - the SBOM would carry no licences."
            exit 1
          fi

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: requirements.txt
          # The licence scanner needs no vulnerability database. Vulnerabilities
          # do not belong in a release SBOM anyway: they go stale while the
          # component list does not, and security.yaml reports them.
          scanners: license
          format: cyclonedx
          output: sbom.raw.json
          exit-code: "0"
          version: ${{ env.SCANNER_VERSION }}
          cache: false
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv

      # Trivy names the root component after the scanned file. It is renamed to
      # the flync distribution and stamped with its version, so the SBOM reads as
      # a description of flync and not of requirements.txt.
      - name: Describe flync as the root component
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FILE: ${{ steps.version.outputs.file }}
        run: |
          jq --arg v "$VERSION" --arg release "$RELEASE_TAG" '
            del(.vulnerabilities)
            | .metadata.component |= (
                .name = "flync"
                | .version = $v
                | .type = "library"
                | .licenses = [{license: {id: "Apache-2.0"}}]
                | if $release != "" then .purl = "pkg:pypi/flync@\($v)" else . end
              )
          ' sbom.raw.json > "$FILE"

          components=$(jq '[.components[]? | select(.type == "library")] | length' "$FILE")
          licensed=$(jq '[.components[]? | select(.type == "library" and (.licenses // [] | length) > 0)] | length' "$FILE")
          if [ "$components" -eq 0 ]; then
            echo "::error::The SBOM lists no components."
            exit 1
          fi
          {
            echo "## SBOM"
            echo
            echo "\`${FILE}\`: **${components}** components, **${licensed}** with a licence."
            if [ -n "$RELEASE_TAG" ]; then
              echo
              echo "Attached to release \`${RELEASE_TAG}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ steps.version.outputs.file }}
          if-no-files-found: error
          retention-days: 28

  # Held apart from generate because that job builds third-party packages, and
  # this is the token that can write to the release.
  attach-to-release:
    name: Attach SBOM to release
    needs: generate
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      # Records that this workflow produced the file from the tagged commit.
      # Verify with: gh attestation verify <file> --repo Technica-Engineering/FLYNC
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.generate.outputs.file }}

      # --clobber replaces the asset when the SBOM of a release is regenerated.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ needs.generate.outputs.file }}
        run: gh release upload "$RELEASE_TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
