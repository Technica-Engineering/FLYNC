[project]
name = "test_plugin"
version = "0.1.0"
description = "A test plugin for flync_converter"
requires-python = ">=3.12"
authors = [{ name = "Dummy Author", email = "dummy.email@example.com" }]
# No runtime dependencies declared on purpose: this plugin is only ever installed
# into an environment that already provides flync_converter (see
# tests/converter_tests/test_plugin_discovery.py and .gitlab-ci.yml).
dependencies = []

[project.entry-points."flync_converter"]
example = "test_plugin.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test_plugin"]
